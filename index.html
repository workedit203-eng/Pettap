<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PetTap Game & Profile</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    
    .page { display: none; padding: 20px; flex-direction: column; align-items: center; height: 100%; overflow-y: auto; padding-bottom: 90px; }
    .page.active { display: flex; }

    /* Тапалка */
    .header { text-align: center; margin-top: 10px; }
    .score-container { font-size: 26px; font-weight: bold; color: #ffcc00; display: flex; gap: 15px; justify-content: center; }
    .mouse-area { margin: auto 0; cursor: pointer; }
    .mouse-btn { font-size: 110px; transition: transform 0.08s; }
    .mouse-btn:active { transform: scale(0.88); }
    
    .energy-box { width: 100%; max-width: 320px; text-align: center; margin-bottom: 10px; }
    .energy-bar-bg { background: #33334d; border-radius: 12px; height: 14px; width: 100%; overflow: hidden; }
    .energy-bar-fill { background: linear-gradient(90deg, #ff9900, #ffcc00); height: 100%; width: 100%; }

    /* Карточки */
    .grid-list { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .card { background: #2a2a40; border-radius: 14px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .card-info { display: flex; align-items: center; gap: 12px; }
    .card-icon { font-size: 32px; }
    .btn-action { background: #007aff; border: none; color: white; padding: 10px 14px; font-weight: bold; border-radius: 10px; cursor: pointer; }
    .btn-action:active { opacity: 0.8; }
    .btn-stars { background: linear-gradient(90deg, #ffcc00, #ff9900); color: #000; }
    .btn-sub { background: linear-gradient(90deg, #00c6ff, #007aff); }

    /* Поля вводу */
    input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3a3a55;
      background: #151522; color: #fff; margin-bottom: 10px; outline: none;
    }

    /* Нижнє Меню */
    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around; background: #151522; padding: 10px 0;
      border-top: 1px solid #2a2a40; width: 100%; z-index: 100;
    }
    .nav-item { color: #8e8e93; font-size: 10px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item.active { color: #007aff; font-weight: bold; }
    .nav-icon { font-size: 18px; }
  </style>
</head>
<body>

  <!-- 1. ТАПАЛКА -->
  <div id="page-tap" class="page active">
    <div class="header">
      <h1>🐭 PetTap</h1>
      <div class="score-container">
        <span>🧀 <span id="score">0</span></span>
        <span>⭐ <span id="starsScore">0</span></span>
      </div>
    </div>

    <div class="mouse-area" id="tapArea">
      <div class="mouse-btn" id="mouseEmoji">🐭</div>
    </div>

    <div class="energy-box">
      <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
      <div style="font-size: 12px; color: #aaa; margin-top: 5px;">Енергія: <span id="energy">100</span>/100</div>
    </div>
  </div>

  <!-- 2. КЕЙСИ -->
  <div id="page-cases" class="page">
    <h2>📦 Рулетка Кейсів</h2>
    <div class="grid-list">
      <div class="card" style="border: 1px solid #00c6ff;">
        <div class="card-info">
          <div class="card-icon">📢</div>
          <div><b>Кейс Каналу</b><br><small>Підпишись на @pettap</small></div>
        </div>
        <button class="btn-action btn-sub" onclick="openChannelCase()">Перейти</button>
      </div>

      <div class="card">
        <div class="card-info">
          <div class="card-icon">🧀</div>
          <div><b>Сирний Кейс</b><br><small>Шанс ⭐ Зірок</small></div>
        </div>
        <button class="btn-action" onclick="openCheeseCase()">100 🧀</button>
      </div>
    </div>
  </div>

  <!-- 3. ПРОФІЛЬ ТА ВИВЕДЕННЯ (НОВИЙ РОЗДІЛ) -->
  <div id="page-profile" class="page">
    <h2>👤 Ваш Профіль</h2>
    <div class="grid-list">
      <div class="card" style="flex-direction: column; align-items: flex-start; gap: 8px;">
        <div><b>Користувач:</b> <span id="username">Гровець</span></div>
        <div><b>Telegram ID:</b> <code id="userId">12345678</code></div>
        <div><b>Баланс ⭐ Stars:</b> <b id="profileStars">0</b></div>
        <div><b>Баланс 🧀 Сиру:</b> <b id="profileCheese">0</b></div>
      </div>

      <h3 style="margin-top: 15px; margin-bottom: 5px;">💸 Виведення ⭐ Stars</h3>
      <div class="card" style="flex-direction: column; width: 100%;">
        <input type="number" id="withdrawAmount" placeholder="Кількість Stars (мін. 15)" min="15">
        <input type="text" id="withdrawAddress" placeholder="Ваш Telegram Username або Гаманець">
        <button class="btn-action btn-stars" style="width: 100%; margin-top: 5px;" onclick="requestWithdrawal()">Запросити виведення</button>
      </div>
    </div>
  </div>

  <!-- 4. РИНОК -->
  <div id="page-shop" class="page">
    <h2>🐭 Ринок мишей</h2>
    <div class="grid-list">
      <div class="card">
        <div class="card-info"><div class="card-icon">🐹</div><div><b>Хом'як</b><br><small>+2 за тап</small></div></div>
        <button class="btn-action" onclick="buyPet('🐹', 2, 50)">50 🧀</button>
      </div>
    </div>
  </div>

  <!-- НИЖНЄ МЕНЮ -->
  <div class="nav-bar">
    <button class="nav-item active" onclick="switchPage('tap', this)"><span class="nav-icon">🎮</span>Гра</button>
    <button class="nav-item" onclick="switchPage('cases', this)"><span class="nav-icon">📦</span>Кейси</button>
    <button class="nav-item" onclick="switchPage('profile', this)"><span class="nav-icon">👤</span>Профіль</button>
    <button class="nav-item" onclick="switchPage('shop', this)"><span class="nav-icon">🐭</span>Ринок</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Отримання даних користувача з Telegram WebApp
    const user = tg?.initDataUnsafe?.user;
    const userId = user?.id || "Невизначено";
    const username = user?.username ? `@${user.username}` : (user?.first_name || "Гравець");

    document.getElementById('userId').innerText = userId;
    document.getElementById('username').innerText = username;

    let score = parseInt(localStorage.getItem('petTapScore')) || 0;
    let stars = parseInt(localStorage.getItem('petTapStars')) || 0;
    let energy = parseInt(localStorage.getItem('petTapEnergy')) || 100;
    let tapPower = parseInt(localStorage.getItem('petTapPower')) || 1;
    let currentEmoji = localStorage.getItem('petEmoji') || '🐭';
    const maxEnergy = 100;

    const scoreEl = document.getElementById('score');
    const starsEl = document.getElementById('starsScore');
    const energyEl = document.getElementById('energy');
    const energyFill = document.getElementById('energyFill');
    const tapArea = document.getElementById('tapArea');
    const mouseEmoji = document.getElementById('mouseEmoji');

    mouseEmoji.innerText = currentEmoji;
    updateUI();

    // Тап
    tapArea.addEventListener('click', () => {
      if (energy <= 0) return;
      score += tapPower;
      energy -= 1;
      saveData();
      updateUI();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    function showAlert(msg) {
      if (tg && tg.showAlert) tg.showAlert(msg);
      else alert(msg);
    }

    // Перехід на канал
    function openChannelCase() {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink("https://t.me/pettap");
      } else {
        window.open("https://t.me/pettap", "_blank");
      }
    }

    // Сирний кейс
    function openCheeseCase() {
      if (score < 100) { showAlert("Потрібно 100 🧀 сиру!"); return; }
      score -= 100;
      let rand = Math.random() * 100;
      if (rand < 70) {
        score += 20;
        showAlert("Ви виграли: 20 🧀 сиру!");
      } else {
        stars += 1;
        showAlert("🎉 Ви виграли 1 ⭐ Зірку!");
      }
      saveData();
      updateUI();
    }

    // Запит на виведення
    function requestWithdrawal() {
      const amount = parseInt(document.getElementById('withdrawAmount').value);
      const address = document.getElementById('withdrawAddress').value;

      if (!amount || amount < 15) {
        showAlert("Мінімальна сума виведення: 15 ⭐");
        return;
      }
      if (stars < amount) {
        showAlert("Недостатньо Зірок на балансі!");
        return;
      }
      if (!address) {
        showAlert("Введіть реквізити для виведення!");
        return;
      }

      stars -= amount;
      saveData();
      updateUI();

      // Відправка даних боту
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "withdraw",
          userId: userId,
          amount: amount,
          address: address
        }));
      }

      showAlert(`Заявку на виведення ${amount} ⭐ прийнято! Адмін зв'яжеться з вами.`);
    }

    // Купівля петів
    function buyPet(emoji, power, cost) {
      if (score < cost) { showAlert("Недостатньо сиру 🧀!"); return; }
      score -= cost;
      tapPower = power;
      currentEmoji = emoji;
      mouseEmoji.innerText = emoji;
      saveData();
      updateUI();
      showAlert(`Успіх! Новий пет: ${emoji}`);
    }

    function saveData() {
      localStorage.setItem('petTapScore', score);
      localStorage.setItem('petTapStars', stars);
      localStorage.setItem('petTapEnergy', energy);
      localStorage.setItem('petTapPower', tapPower);
      localStorage.setItem('petEmoji', currentEmoji);
    }

    function updateUI() {
      scoreEl.innerText = score;
      starsEl.innerText = stars;
      energyEl.innerText = energy;
      energyFill.style.width = `${(energy / maxEnergy) * 100}%`;

      document.getElementById('profileStars').innerText = stars;
      document.getElementById('profileCheese').innerText = score;
    }

    setInterval(() => {
      if (energy < maxEnergy) {
        energy++;
        localStorage.setItem('petTapEnergy', energy);
        updateUI();
      }
    }, 1500);

    function switchPage(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
